<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IDS Jakarta - SalesFlow Analytics</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Mencegah double scrollbar */
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Container Full Screen */
    .embed-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background: #0f172a;
    }

    /* Iframe Full Screen */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading Overlay Styling */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Spinner Bulat Berputar */
    .spinner-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }

    .spinner-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: #0284c7;
      border-right-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .spinner-ring:nth-child(2) {
      width: 70%;
      height: 70%;
      top: 15%;
      left: 15%;
      border-top-color: #10b981;
      border-right-color: #34d399;
      animation: spin-reverse 0.9s linear infinite;
    }

    .spinner-ring:nth-child(3) {
      width: 40%;
      height: 40%;
      top: 30%;
      left: 30%;
      border-top-color: #f59e0b;
      animation: spin 1.5s ease-in-out infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    /* Teks Bergantian */
    .loading-text {
      color: #f8fafc;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
      min-height: 36px;
      padding: 0 16px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .loading-text.fade-out {
      opacity: 0;
      transform: translateY(-6px);
    }

    .sub-caption {
      margin-top: 8px;
      color: #64748b;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="embed-container">
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner-wrapper">
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
      </div>
      <div id="dynamicText" class="loading-text">IDS JAKARTA 🚀</div>
      <div class="sub-caption">SalesFlow Analytics Dashboard</div>
    </div>

    <iframe 
      id="dashboardIframe"
      allow="fullscreen"
      title="IDS Jakarta SalesFlow Dashboard">
    </iframe>
  </div>

  <script>
    const TARGET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwnkapk3o69krnqcYE8Z8QcSRNAaiRy-aVrRD6-DsGirqqWKiL_w9Fs_Y_sH_uGaFxSig/exec";

    const loadingTexts = [
      "IDS JAKARTA 🚀",
      "DIVISI BLOWER HEBAT 💨",
      "ZERO WARANTY ZERO WORRY 😎",
      "NUNGGUIN YA ⏳"
    ];

    let currentIndex = 0;
    const textElement = document.getElementById("dynamicText");
    const overlayElement = document.getElementById("loadingOverlay");
    const iframeElement = document.getElementById("dashboardIframe");

    const textSequence = setInterval(() => {
      textElement.classList.add("fade-out");

      setTimeout(() => {
        currentIndex++;

        if (currentIndex < loadingTexts.length) {
          textElement.innerText = loadingTexts[currentIndex];
          textElement.classList.remove("fade-out");
        } else {
          clearInterval(textSequence);
          
          // Event listener di-assign sebelum URL dimuat
          iframeElement.onload = function() {
            setTimeout(() => {
              overlayElement.classList.add("hidden");
            }, 300);
          };

          iframeElement.src = TARGET_WEBAPP_URL;
        }
      }, 200);
    }, 1500);
  </script>

</body>
</html>
